name: Deploy Application Docker Image to EC2 instance

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  continuous-integration:
    name: Continuous Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPO }}
          IMAGE_TAG: latest
        run: |
          docker build -t "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}" .
          docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

  continuous-deployment:
    name: Continuous Deployment (t2.medium-safe)
    needs: continuous-integration
    runs-on: self-hosted

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Pull latest image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPO }}
          IMAGE_TAG: latest
        run: |
          docker pull "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

      - name: Stop and remove existing container (if any)
        run: |
          docker rm -f medical-rag-agent || true

      - name: Prune dangling images (disk pressure protection)
        run: |
          docker image prune -f || true

      - name: Run Docker Image (resource constrained for t2.medium)
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPO }}
          IMAGE_TAG: latest

          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          docker run -d \
            --name medical-rag-agent \
            --restart unless-stopped \
            --cpus="1.5" \
            --memory="3g" \
            --memory-swap="3g" \
            --log-driver json-file \
            --log-opt max-size=10m \
            --log-opt max-file=3 \
            -p 8080:8080 \
            -e PINECONE_API_KEY="${PINECONE_API_KEY}" \
            -e OPENAI_API_KEY="${OPENAI_API_KEY}" \
            "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

      - name: Health check (fail deploy if app does not start)
        run: |
          set -e
          for i in {1..20}; do
            if curl -fsS "http://localhost:8080/" > /dev/null; then
              echo "App is up."
              exit 0
            fi
            echo "Waiting for app... ($i/20)"
            sleep 3
          done
          echo "App failed to start."
          docker logs medical-rag-agent --tail 200 || true
          exit 1
